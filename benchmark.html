<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V's MultiGen AI Chat — Benchmark Lab</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="logo.png">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="config.js"></script>
  <style>
    :root {
      --primary: #0f172a;
      --primary-light: #1e293b;
      --accent: #0E7490;
      --accent-light: #5BA7C9;
      --accent-bg: rgba(14,116,144, 0.08);
      --red: #ef4444;
      --red-bg: rgba(239, 68, 68, 0.1);
      --orange: #f97316;
      --orange-bg: rgba(249, 115, 22, 0.1);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.1);
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.1);
      --violet: #7c3aed;
      --violet-bg: rgba(124,58,237, 0.1);
      --purple: #2563EB;
      --purple-bg: rgba(37,99,235, 0.1);
      --pink: #ec4899;
      --pink-bg: rgba(236, 72, 153, 0.1);
      --background: #F2F6F6;
      --surface: #ffffff;
      --surface-2: #F4FAFA;
      --text-primary: #15201F;
      --text-secondary: #4F5E5B;
      --text-muted: #94a3b8;
      --border: #E0E9E8;
      --shadow-sm: 0 2px 4px rgba(8,40,45,.05);
      --shadow-md: 0 2px 4px rgba(8,40,45,.05), 0 14px 30px -12px rgba(8,40,45,.20);
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --font-head: 'Space Grotesk', system-ui, sans-serif;
      --font-body: 'Inter', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      /* validated dataviz palette — light mode */
      --chart-1: #2a78d6;   /* blue  — new models / primary */
      --chart-2: #1baf7a;   /* aqua  — reasoning depth */
      --chart-3: #eda100;   /* yellow */
      --chart-grid: #e1e0d9;
      --chart-ink-muted: #898781;
    }

    [data-theme="dark"] {
      --background: #0f172a; --surface: #1e293b; --surface-2: #16233b;
      --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
      --border: #334155;
      --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.5);
      --chart-1: #3987e5; --chart-2: #199e70; --chart-3: #c98500;
      --chart-grid: #2c2c2a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background: var(--background); color: var(--text-primary);
      min-height: 100vh; line-height: 1.5;
    }

    /* ===== TOP NAV ===== */
    .top-nav {
      background: var(--primary); padding: 0 32px; height: 60px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .nav-brand { display: flex; align-items: center; gap: 12px; color: white; }
    .nav-brand .logo {
      width: 38px; height: 38px; background: #fff; border-radius: var(--radius-md);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
    .nav-brand .logo img { width: 100%; height: 100%; object-fit: contain; }
    .nav-brand .logo .material-icons { font-size: 20px; color: var(--accent); }
    .nav-brand h1 { font-family: var(--font-head); font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .nav-brand span { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 400; }
    .nav-actions { display: flex; align-items: center; gap: 8px; }
    .nav-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: var(--radius-md);
      font-size: 13px; font-weight: 500; cursor: pointer;
      transition: all 0.15s; text-decoration: none; border: none;
      font-family: var(--font-body);
    }
    .nav-btn .material-icons { font-size: 18px; }
    .nav-btn.primary { background: var(--accent); color: white; }
    .nav-btn.primary:hover { background: var(--accent-light); }
    .nav-btn.secondary { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.85); }
    .nav-btn.secondary:hover { background: rgba(255,255,255,0.14); }

    /* ===== SUITE TAB BAR ===== */
    .suite-bar {
      position: sticky; top: 60px; z-index: 90;
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 10px 32px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: thin;
    }
    .suite-tab {
      display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
      padding: 8px 15px; border-radius: 999px; cursor: pointer;
      border: 1px solid var(--border); background: var(--surface);
      color: var(--text-secondary); font-size: 13px; font-weight: 600;
      font-family: var(--font-body); transition: all 0.15s;
    }
    .suite-tab .material-icons { font-size: 17px; }
    .suite-tab:hover { border-color: var(--accent); color: var(--accent); }
    .suite-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .suite-tab .st-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: none; }
    .suite-tab.has-results .st-dot { display: inline-block; }

    /* ===== LAYOUT ===== */
    .page-wrap { max-width: 1500px; margin: 0 auto; padding: 24px 32px 90px; }
    @media (max-width: 768px) {
      .top-nav { padding: 0 14px; }
      .suite-bar { padding: 8px 14px; }
      .page-wrap { padding: 16px 14px 70px; }
      .nav-btn span:not(.material-icons) { display: none; }
      .nav-brand span { display: none; }
    }

    .suite-panel { display: none; }
    .suite-panel.active { display: block; animation: fadeUp .25s ease; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* ===== SUITE HERO ===== */
    .suite-hero { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 18px; }
    .suite-hero-icon {
      width: 52px; height: 52px; border-radius: var(--radius-md); flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-bg); color: var(--accent);
    }
    .suite-hero-icon .material-icons { font-size: 28px; }
    .suite-hero h2 { font-family: var(--font-head); font-size: 24px; letter-spacing: -0.4px; }
    .suite-hero p { color: var(--text-secondary); font-size: 14px; max-width: 900px; margin-top: 2px; }

    /* ===== CARDS ===== */
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
      padding: 20px 22px; margin-bottom: 18px;
    }
    .card-title {
      display: flex; align-items: center; gap: 8px; font-family: var(--font-head);
      font-size: 15px; font-weight: 700; margin-bottom: 12px;
    }
    .card-title .material-icons { font-size: 19px; color: var(--accent); }
    .card-title .ct-hint { font-size: 12px; color: var(--text-muted); font-weight: 400; font-family: var(--font-body); margin-left: auto; }

    /* Challenge config */
    .preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .preset-chip {
      padding: 7px 13px; border-radius: 999px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text-secondary);
      cursor: pointer; transition: all .15s; font-family: var(--font-body);
    }
    .preset-chip:hover { border-color: var(--accent); color: var(--accent); }
    .preset-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .challenge-textarea {
      width: 100%; min-height: 130px; resize: vertical;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface-2); color: var(--text-primary);
      padding: 12px 14px; font-size: 13px; line-height: 1.6; font-family: var(--font-body);
    }
    .challenge-textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

    .rubric-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .rubric-chip { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--violet-bg); color: var(--violet); letter-spacing: .2px; }
    .expected-box {
      margin-top: 10px; padding: 10px 14px; border-radius: var(--radius-sm);
      background: var(--green-bg); border: 1px dashed var(--green);
      font-size: 12.5px; color: var(--text-secondary);
    }
    .expected-box strong { color: var(--green); }

    /* Model picker */
    .picker-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
    .mini-btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--border); background: var(--surface-2);
      font-size: 12px; font-weight: 600; color: var(--text-secondary);
      font-family: var(--font-body); transition: all .15s;
    }
    .mini-btn:hover { border-color: var(--accent); color: var(--accent); }
    .mini-btn .material-icons { font-size: 15px; }
    .picker-count { font-size: 12px; color: var(--text-muted); margin-left: auto; }
    .picker-count b { color: var(--accent); font-family: var(--font-mono); }
    .model-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .model-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 7px 12px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 12.5px; font-weight: 500; color: var(--text-secondary);
      transition: all .12s; user-select: none;
    }
    .model-chip:hover { border-color: var(--accent-light); }
    .model-chip.selected { border-color: var(--accent); background: var(--accent-bg); color: var(--text-primary); }
    .model-chip .mc-check { font-size: 15px; color: var(--accent); display: none; }
    .model-chip.selected .mc-check { display: inline; }
    .badge-new { font-size: 9.5px; font-weight: 800; letter-spacing: .5px; padding: 2px 6px; border-radius: 999px; background: linear-gradient(135deg, #f97316, #ec4899); color: #fff; }
    .mc-price { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }

    .judge-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
    .judge-row label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
    .judge-select {
      padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text-primary); font-size: 12.5px;
      font-family: var(--font-body); max-width: 340px;
    }
    .judge-note { font-size: 11.5px; color: var(--text-muted); }

    /* Run bar */
    .run-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-top: 16px; }
    .run-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--accent), var(--purple));
      color: #fff; border: none; cursor: pointer;
      padding: 11px 26px; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 700; font-family: var(--font-head);
      letter-spacing: .2px; box-shadow: var(--shadow-md); transition: transform .12s, filter .15s;
    }
    .run-btn:hover:not(:disabled) { transform: translateY(-1px); filter: brightness(1.08); }
    .run-btn:disabled { opacity: .55; cursor: not-allowed; }
    .run-btn .material-icons { font-size: 19px; }
    .cost-note { font-size: 12px; color: var(--text-muted); }
    .cost-note strong { color: var(--text-secondary); font-family: var(--font-mono); }
    .run-status { font-size: 12.5px; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 6px; }

    .spin { animation: spin 1s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== RESULTS GRID ===== */
    .results-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); }
    @media (max-width: 960px) { .results-grid { grid-template-columns: 1fr; } }

    .result-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-sm);
      display: flex; flex-direction: column;
    }
    .result-card.rc-winner { border: 2px solid var(--amber); box-shadow: 0 0 0 4px var(--amber-bg), var(--shadow-md); }
    .rc-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border-bottom: 1px solid var(--border); background: var(--surface-2); }
    .rc-letter {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; font-family: var(--font-head);
    }
    .rc-name { font-weight: 700; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rc-sub { font-size: 11px; color: var(--text-muted); }
    .rc-status { margin-left: auto; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .rc-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); }
    .rc-dot.running { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
    .rc-dot.done { background: var(--green); }
    .rc-dot.error { background: var(--red); }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .rc-trophy { color: var(--amber); font-size: 20px !important; }

    .rc-metrics { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 9px 16px; border-bottom: 1px solid var(--border); font-size: 11.5px; color: var(--text-muted); }
    .rc-metrics b { color: var(--text-secondary); font-family: var(--font-mono); font-weight: 600; }

    .rc-tabs { display: flex; gap: 2px; padding: 8px 12px 0; flex-wrap: wrap; }
    .rc-tab {
      padding: 6px 13px; border-radius: 8px 8px 0 0; font-size: 12px; font-weight: 600;
      color: var(--text-muted); cursor: pointer; border: 1px solid transparent; border-bottom: none;
      font-family: var(--font-body); background: transparent;
    }
    .rc-tab.active { color: var(--accent); background: var(--surface-2); border-color: var(--border); }

    .rc-body { padding: 14px 16px; flex: 1; min-height: 110px; }
    .rc-pane { display: none; }
    .rc-pane.active { display: block; }
    .rc-text { font-size: 13px; line-height: 1.7; color: var(--text-primary); max-height: 440px; overflow-y: auto; white-space: pre-wrap; word-break: break-word; }
    .rc-code { background: #0f172a; color: #cbd5e1; border-radius: var(--radius-sm); padding: 14px; max-height: 440px; overflow: auto; white-space: pre; line-height: 1.55; font-family: var(--font-mono); font-size: 12px; }
    .rc-reasoning {
      font-size: 12.5px; line-height: 1.7; color: var(--text-secondary);
      background: var(--violet-bg); border-left: 3px solid var(--violet);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 12px 14px; max-height: 440px; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
    }
    .rc-empty { color: var(--text-muted); font-size: 12.5px; padding: 8px 0; }

    .rc-iframe-wrap { position: relative; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: #fff; }
    .rc-iframe-wrap iframe { width: 100%; height: 380px; border: none; display: block; background: #fff; }
    .rc-iframe-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 6px; z-index: 5; }
    .rc-iframe-tools .mini-btn { background: rgba(15,23,42,.75); color: #fff; border-color: transparent; backdrop-filter: blur(4px); }
    .rc-iframe-tools .mini-btn:hover { color: #fff; background: rgba(15,23,42,.95); }

    .rc-img { width: 100%; border-radius: var(--radius-sm); cursor: zoom-in; display: block; border: 1px solid var(--border); }
    .rc-video { width: 100%; border-radius: var(--radius-sm); display: block; background: #000; max-height: 440px; }
    .rc-poll-log { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-top: 8px; max-height: 90px; overflow-y: auto; }

    /* judge scorecard */
    .rc-judge { border-top: 1px dashed var(--border); padding: 12px 16px; background: var(--surface-2); }
    .rc-judge-total { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
    .rc-judge-total .jt-num { font-family: var(--font-head); font-size: 26px; font-weight: 700; color: var(--accent); }
    .rc-judge-total .jt-outof { font-size: 12px; color: var(--text-muted); }
    .rc-judge-total .jt-flag { margin-left: auto; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
    .jt-flag.ok { background: var(--green-bg); color: var(--green); }
    .jt-flag.bad { background: var(--red-bg); color: var(--red); }
    .crit-row { display: grid; grid-template-columns: 140px 1fr 34px; align-items: center; gap: 8px; margin-bottom: 5px; }
    .crit-label { font-size: 11px; color: var(--text-secondary); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .crit-meter { height: 7px; border-radius: 4px; background: var(--chart-grid); overflow: hidden; }
    .crit-fill { height: 100%; border-radius: 4px; background: var(--chart-1); transition: width .6s ease; }
    .crit-val { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
    .rc-verdict { font-size: 12px; color: var(--text-secondary); font-style: italic; margin-top: 8px; line-height: 1.6; }

    .rc-stars { display: flex; align-items: center; gap: 3px; padding: 10px 16px; border-top: 1px solid var(--border); }
    .rc-stars .rs-label { font-size: 11.5px; color: var(--text-muted); margin-right: 6px; font-weight: 600; }
    .star { cursor: pointer; color: var(--border); font-size: 20px !important; transition: color .1s, transform .1s; }
    .star:hover { transform: scale(1.15); }
    .star.on { color: var(--amber); }

    /* ===== JUDGE SUMMARY & CHARTS ===== */
    .verdict-card { border-left: 4px solid var(--accent); }
    .verdict-summary { font-size: 13.5px; line-height: 1.7; color: var(--text-secondary); }
    .podium { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; }
    .podium-slot { display: flex; align-items: center; gap: 9px; padding: 9px 15px; border-radius: var(--radius-md); border: 1px solid var(--border); background: var(--surface-2); font-size: 13px; font-weight: 600; }
    .podium-slot .p-medal { font-size: 18px; }
    .podium-slot.p1 { border-color: var(--amber); background: var(--amber-bg); }

    .chart-title { font-size: 12.5px; font-weight: 700; color: var(--text-secondary); margin: 16px 0 10px; }
    .chart-legend { display: flex; gap: 16px; margin-bottom: 12px; flex-wrap: wrap; }
    .chart-legend .lg-item { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-secondary); }
    .chart-legend .lg-swatch { width: 11px; height: 11px; border-radius: 3px; }
    .hbar-row { display: grid; grid-template-columns: 180px 1fr; gap: 10px; align-items: center; margin-bottom: 9px; }
    .hbar-label { font-size: 12px; color: var(--text-secondary); font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hbar-track { position: relative; height: 22px; display: flex; align-items: center; }
    .hbar-fill { height: 16px; border-radius: 0 4px 4px 0; background: var(--chart-1); transition: width .7s cubic-bezier(.2,.8,.3,1); min-width: 2px; }
    .hbar-val { font-size: 11.5px; font-family: var(--font-mono); color: var(--text-secondary); margin-left: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
    @media (max-width: 640px) { .hbar-row { grid-template-columns: 104px 1fr; } .hbar-label { font-size: 11px; } .crit-row { grid-template-columns: 110px 1fr 30px; } }

    /* ===== VIDEO / IMAGE REF ===== */
    .ref-zone { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; }
    .ref-preview {
      width: 170px; height: 170px; border-radius: var(--radius-md); border: 2px dashed var(--border);
      display: flex; align-items: center; justify-content: center; overflow: hidden;
      background: var(--surface-2); flex-shrink: 0; cursor: pointer;
    }
    .ref-preview img { width: 100%; height: 100%; object-fit: cover; }
    .ref-preview .material-icons { font-size: 40px; color: var(--text-muted); }
    .ref-controls { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 240px; }
    .ref-controls .hint { font-size: 12px; color: var(--text-muted); }

    /* ===== LEADERBOARD ===== */
    .lb-stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 18px; }
    .stat-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 14px 18px; }
    .stat-tile .st-val { font-family: var(--font-head); font-size: 26px; font-weight: 700; }
    .stat-tile .st-lbl { font-size: 11.5px; color: var(--text-muted); font-weight: 600; letter-spacing: .3px; }
    .lb-table-wrap { overflow-x: auto; }
    table.lb-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }

    .lb-history-item { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
    .lb-history-item .hi-suite { font-weight: 700; color: var(--accent); }
    .lb-history-item .hi-prompt { color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 420px; }
    .lb-history-item .hi-winner { margin-left: auto; font-weight: 600; color: var(--amber); display: flex; align-items: center; gap: 4px; }

    /* ===== MISC ===== */
    .banner-warn {
      display: flex; align-items: center; gap: 10px; padding: 12px 18px; margin-bottom: 18px;
      border-radius: var(--radius-md); background: var(--amber-bg); border: 1px solid var(--amber);
      color: var(--text-primary); font-size: 13px;
    }
    .banner-warn .material-icons { color: var(--amber); }
    .banner-warn a { color: var(--accent); font-weight: 600; }

    .lightbox { position: fixed; inset: 0; z-index: 300; background: rgba(10,15,30,.92); display: none; align-items: center; justify-content: center; padding: 30px; cursor: zoom-out; }
    .lightbox.open { display: flex; }
    .lightbox img { max-width: 96%; max-height: 92vh; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
      padding: 11px 22px; border-radius: 999px; box-shadow: var(--shadow-md);
      opacity: 0; pointer-events: none; transition: all .25s; z-index: 400; max-width: 90vw; text-align: center;

  </div>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')"><img id="lightboxImg" alt="zoom"></div>
  <div class="toast" id="toast"></div>

  <script>
    'use strict';
    const BASE_URL = 'https://api.venice.ai/api/v1';
    const NEW_WINDOW_DAYS = 45;
    const SEEN_MODELS_KEY = 'venice_seen_models';   // shared with dashboard.html
    const HISTORY_KEY = 'venice_bench_history_v1';
    const MAX_CONTENDERS = 6;

    function getApiKey() {
      if (window.VENICE_API_KEY && window.VENICE_API_KEY !== 'your-venice-api-key-here') return window.VENICE_API_KEY;
      return localStorage.getItem('venice_user_api_key') || localStorage.getItem('venice_backend_api_key') || '';
    }

    // ══════════════════════════════════════════════════════════════════
    // SUITE DEFINITIONS
    // ══════════════════════════════════════════════════════════════════
    const FRONTEND_APPENDIX = `

HARD REQUIREMENTS:
- ONE self-contained HTML file: inline ALL CSS and JS. No external libraries, fonts, CDNs, or image files (draw any art with CSS gradients, inline SVG, or canvas).
- Must be responsive (mobile to desktop) and legible.
- Aim for something genuinely distinctive — avoid the generic "centered hero + three feature cards" template.
- Return ONLY the code, in a single \`\`\`html fenced block, nothing else.`;

    const SUITES = [
      {
        id: 'frontend', kind: 'text', icon: 'brush', category: 'text',
        name: 'Frontend Design',
        tagline: 'Each model builds a complete single-file web page from the same brief. Pages render live below so you can judge beauty and originality with your own eyes — then a vision-capable AI judge scores the design.',
        rubric: ['Visual impact', 'Originality', 'Typography & color', 'Layout & responsiveness', 'Motion & interactivity', 'Code quality'],
        renderMode: 'html', judged: true, maxTokens: 14000, temperature: 0.85,
        presets: [
          { name: 'Generative-art studio', prompt: `Design and build a complete single-file landing page for "Studio Umbra", a fictional generative-art and creative-coding studio.

It must feel genuinely unique and art-directed: consider an asymmetric editorial grid, oversized display typography, a generative animated background (pure CSS or vanilla-JS canvas), unusual navigation, a custom cursor, and scroll-triggered reveals. Include: a hero, a selected-works section (describe 3 fictional works), a studio manifesto, and a contact footer. Dark, moody, editorial aesthetic.` + FRONTEND_APPENDIX },
          { name: 'MedTech product hero', prompt: `Design and build a complete single-file landing page for "Meridian Cardiac", a fictional continuous cardiac-monitoring wearable.

It must feel clinical, trustworthy AND beautiful — precision-medical, not startup-generic. Requirements: an animated ECG trace drawn with inline SVG or CSS as the hero centerpiece; a stats strip (99.2% arrhythmia detection sensitivity, 14-day battery, FDA-cleared); a "how it works" section with three steps; a clinician testimonial; a refined restrained palette; superb typographic hierarchy.` + FRONTEND_APPENDIX },
          { name: 'Interactive trial poster', prompt: `Design and build a single-file interactive "scientific poster" microsite presenting the (fictional) ASCEND-OB phase 3 trial: N=1,214 adults, 72-week treatment, primary endpoint mean weight change −16.2% vs −2.4% placebo (ETD −13.8%, 95% CI −14.9 to −12.7, p<0.001), GI adverse events 44% vs 18%.

Turn a dry academic poster into a stunning scrollytelling or tabbed experience: hand-draw an inline-SVG results chart (bars or curves) that animates into view, big-number stat callouts, a methods section, a limitations section, and proper footnotes. Elegant scientific-editorial art direction (think Nature meets Swiss design).` + FRONTEND_APPENDIX }
        ]
      },
      {
        id: 'reasoning', kind: 'text', icon: 'psychology', category: 'reasoning',
        name: 'Reasoning X-Ray',
        tagline: 'Runs reasoning models on verifiable problems with thinking enabled, captures the full chain of thought, and compares reasoning-token spend, reasoning speed, and correctness side by side.',
        rubric: ['Correct final answer', 'Rigor of derivation', 'Efficiency (no rambling)', 'Clarity of final answer'],
        renderMode: 'reasoning', judged: true, reasoningSuite: true, maxTokens: 16000, temperature: 0.2,
        presets: [
          { name: 'PK dosing math', expected: 't½ ≈ 8.58 h · infusion rate = 10.5 mg/h · Cmax,ss ≈ 3.10 mg/L · Cmin,ss ≈ 1.18 mg/L · loading dose = 130 mg', prompt: `A 68 kg patient starts IV therapy with drug X, which follows a one-compartment model with first-order elimination. CL = 4.2 L/h, Vd = 52 L.

(a) Compute the elimination half-life.
(b) Compute the continuous IV infusion rate needed to achieve Css = 2.5 mg/L.
(c) If instead the patient receives 100 mg IV bolus every 12 h, compute Cmax,ss and Cmin,ss at steady state.
(d) Compute the loading dose that immediately achieves 2.5 mg/L.

Show your work, then finish with a clearly labeled "FINAL ANSWERS" list giving all four values with units, each rounded to 3 significant figures.` },
          { name: 'Site-activation logic', expected: 'Aurora = January · Everest = February · Cedar = March · Fairview = April · Beacon = May · Delta = June (unique)', prompt: `Six clinical trial sites — Aurora, Beacon, Cedar, Delta, Everest, Fairview — must each activate in a different month, January through June. Constraints:

1. Cedar activates exactly two months after Aurora.
2. Everest activates before Beacon, and Beacon activates before Delta.
3. Fairview activates in a month immediately adjacent to Cedar's month (directly before or after Cedar).
4. Everest does not activate in January.
5. Everest activates before Fairview.

Determine the unique activation month for every site and prove no other assignment satisfies all constraints. Finish with a clearly labeled "FINAL ANSWER" table of site → month.` },
          { name: 'Dialysate Fermi estimate', expected: 'Order of magnitude ~10⁹–10¹⁰ L/yr. Typical build-up: ~450k in-center patients × 3/wk × ~4 h × 500 mL/min ≈ 8–9 billion L/yr', prompt: `Estimate the total annual volume of dialysate (in litres) consumed by all in-center hemodialysis patients in the United States.

State every assumption explicitly (patient count, sessions per week, session length, dialysate flow rate), show the arithmetic step by step, sanity-check the result a second way, and finish with a clearly labeled "FINAL ANSWER" giving a point estimate and a plausible range.` }
        ]
      },
      {
        id: 'biomed', kind: 'text', icon: 'biotech', category: 'text',
        name: 'BioMed Engineering',
        tagline: 'Hard biomedical-engineering design problems that demand quantitative rigor, safety thinking, and regulatory awareness — not just fluent prose. Scored by an AI judge on technical merit.',
        rubric: ['Technical accuracy', 'Quantitative rigor', 'Safety & regulatory', 'Systems thinking', 'Clarity'],
        renderMode: 'text', judged: true, maxTokens: 9000, temperature: 0.4,
        presets: [
          { name: 'Closed-loop insulin', prompt: `You are the lead systems engineer designing a closed-loop (artificial pancreas) insulin delivery system using a CGM with ~10-minute sensor lag and subcutaneous insulin with ~20-minute absorption delay.

(a) Choose and justify a control strategy (PID vs MPC vs hybrid), referencing how each handles the two delays.
(b) Explain quantitatively how you compensate for sensor lag and insulin action delay (prediction horizon, insulin-on-board model).
(c) Define hard safety constraints and a fault-detection scheme covering sensor dropout, infusion-set occlusion, and meal disturbances.
(d) Map the design to IEC 62304 software safety classification and ISO 14971 risk controls.
(e) Outline the validation pathway: in-silico (FDA-accepted UVA/Padova simulator), then clinical.

Be concrete and quantitative wherever possible.` },
          { name: 'ECG lead-off detection', prompt: `Design the analog front end and signal-processing chain for a 3-lead wearable ECG that must reliably detect QRS complexes during motion.

(a) Specify the instrumentation-amplifier stage, target CMRR, input impedance, and how you achieve them.
(b) Design the filter chain (high-pass, low-pass, notch) with concrete corner frequencies and justify each against ECG bandwidth and artifact sources.
(c) Describe a lead-off detection scheme and a motion-artifact mitigation approach (e.g., adaptive filtering with an accelerometer reference).
(d) Choose an ADC resolution and sample rate and justify them from the signal's dynamic range and bandwidth.
(e) State the dominant noise sources and your quantitative noise budget.` },
          { name: 'Bioresorbable stent', prompt: `Propose a design for a next-generation bioresorbable coronary stent.

(a) Select a base material (polymer or metal alloy) and justify it in terms of radial strength, resorption timeline, and degradation byproducts.
(b) Give target mechanical specs (radial strength, recoil %, resorption half-life) and explain how geometry/strut thickness trade against them.
(c) Address the clinical failure modes of first-generation bioresorbable scaffolds (late scaffold thrombosis, strut fracture) and how your design mitigates them.
(d) Outline the biocompatibility and mechanical bench testing program and the relevant ISO 25539 / ASTM standards.` }
        ]
      },
      {
        id: 'medaffairs', kind: 'text', icon: 'clinical_notes', category: 'text',
        name: 'Medical Affairs',
        tagline: 'Real medical-affairs deliverables — evidence synthesis, payer value stories, MSL objection handling — scored by an AI judge on accuracy, balance, and compliance discipline.',
        rubric: ['Scientific accuracy', 'Evidence & data use', 'Balance & fair-balance', 'Compliance awareness', 'Audience fit & clarity'],
        renderMode: 'text', judged: true, maxTokens: 9000, temperature: 0.5,
        presets: [
          { name: 'Evidence-gap analysis', prompt: `Act as a Medical Science Liaison lead. For a (hypothetical) newly approved GLP-1/GIP dual agonist for type 2 diabetes with proven HbA1c and weight benefit, produce a structured EVIDENCE-GAP ANALYSIS to guide the medical strategy.

Cover: (1) current strength of evidence by domain (glycemic, weight, cardiovascular outcomes, renal, MASH); (2) the key unanswered questions a thoughtful KOL would raise; (3) prioritized evidence-generation options (RCT, RWE, registry, ISS) with rationale; (4) how you would sequence them. Maintain fair balance and clearly separate established evidence from hypothesis. Do NOT fabricate specific trial names or numeric results — reason at the level of evidence categories.` },
          { name: 'Payer value story', prompt: `Draft the skeleton of a payer value story / AMCP-style dossier summary for a novel biologic in severe eosinophilic asthma, aimed at a P&T committee.

Include: burden of illness, unmet need, mechanism, a clear (clearly-labeled illustrative) efficacy/safety evidence summary, comparative effectiveness framing vs standard of care, a budget-impact and cost-offset argument (hospitalizations/exacerbations avoided), and the key limitations/uncertainties. Keep claims evidence-anchored and balanced; explicitly flag anything that would require on-label substantiation. Use illustrative placeholders for any specific numbers rather than inventing precise trial data.` },
          { name: 'KOL objection handling', prompt: `A skeptical cardiology KOL says: "Your outcomes trial only showed a relative risk reduction — the absolute benefit looks tiny, the number needed to treat is high, and the subgroup you're excited about wasn't pre-specified. Why should I change practice?"

As a field medical/MSL professional, write a scientifically rigorous, compliant response. Correctly explain relative vs absolute risk and NNT, address the pre-specified vs post-hoc subgroup concern honestly, stay balanced and non-promotional, avoid off-label promotion, and demonstrate genuine scientific exchange rather than spin. Note where you would follow up with data on file or refer to the label.` }
        ]
      },
      {
        id: 'image', kind: 'image', icon: 'insights', category: 'image',
        name: 'Infographic Images',
        tagline: 'The toughest test for image models: dense, text-heavy infographics that must render legible typography AND beautiful embedded art. Each model gets the same brief; a vision AI judge scores text accuracy and design.',
        rubric: ['Text legibility & accuracy', 'Information density', 'Layout & hierarchy', 'Artistic quality', 'Overall usefulness'],
        renderMode: 'image', judged: true, visionJudge: true, imageOpts: { width: 1024, height: 1280 },
        presets: [
          { name: 'Heart anatomy infographic', prompt: `A highly detailed educational infographic poster titled "THE HUMAN HEART" — anatomically accurate cross-section of a human heart in the center rendered as elegant vintage-botanical / scientific-illustration line art with subtle watercolor washes. Around it, clearly legible printed labels and short captions: "Right Atrium", "Left Ventricle", "Aorta", "Pulmonary Artery", "Mitral Valve", plus a small "Cardiac Cycle" panel with 3 numbered steps and a "Did you know? The heart beats ~100,000 times a day" callout box. Clean typographic grid, muted anatomical color palette, crisp readable sans-serif and serif type, poster layout. Text must be sharp and correctly spelled.` },
          { name: 'Coffee brewing chart', prompt: `A beautiful modern kitchen wall infographic titled "THE ART OF POUR-OVER COFFEE". Include labeled diagram of a pour-over dripper with clearly legible text: water temperature "94°C", ratio "1:16", grind "medium-fine", bloom "30s", total brew time "3:00". Add a small step-by-step numbered guide (4 steps) and a flavor wheel accent with words like "Floral", "Nutty", "Bright". Warm earthy palette, hand-drawn illustrative style with fine ink linework and gentle textured shading, elegant editorial typography. All text must be crisp, correctly spelled and readable.` },
          { name: 'Clinical trial phases', prompt: `A clean, professional medical infographic titled "PHASES OF A CLINICAL TRIAL". A horizontal timeline with four stages, each a labeled panel: "Phase 1 — Safety (20–100 people)", "Phase 2 — Efficacy (100–300)", "Phase 3 — Confirmation (1,000–3,000)", "Phase 4 — Post-Marketing". Include small tasteful iconographic illustrations (people, flasks, charts) drawn in a refined flat-vector medical style, a soft clinical blue/teal palette, and a short "Did you know?" fact box. Typography must be sharp, correctly spelled, and perfectly legible.` }
        ]
      },
      {
        id: 'video', kind: 'video', icon: 'movie', category: 'video',
        name: 'Video Identity',
        tagline: 'Image-to-video and reference-to-video head-to-head focused on the hard part: keeping facial features and identity stable while producing smooth, high-quality motion. Bring your own reference image; rate identity retention and motion quality.',
        rubric: ['Identity / facial retention', 'Motion smoothness', 'Video quality & sharpness', 'Prompt adherence', 'Artifact-free'],
        renderMode: 'video', judged: false, videoOpts: { duration: 5, width: 720, height: 1280 },
        presets: [
          { name: 'Portrait — subtle motion', prompt: `The person in the reference image slowly smiles and gives a gentle, natural nod, blinking softly. Keep facial features, identity, skin tone and lighting perfectly consistent. Subtle cinematic camera push-in, shallow depth of field. No distortion or morphing of the face.` },
          { name: 'Portrait — speaking', prompt: `The person in the reference image talks naturally to the camera as if presenting, with realistic lip movement and expressive but subtle head motion. Preserve exact identity and facial structure throughout. Steady, professional lighting; smooth motion; no warping.` },
          { name: 'Turnaround', prompt: `The subject from the reference image slowly turns their head from looking slightly left to facing the camera, hair moving naturally. Maintain consistent identity, facial features and proportions across the whole clip. Soft studio lighting, high detail, no morphing artifacts.` }
        ]
      }
    ];

    // Leaderboard is a virtual "suite" tab.
    const LEADERBOARD = { id: 'leaderboard', icon: 'leaderboard', name: 'Leaderboard' };

    // ══════════════════════════════════════════════════════════════════
    // GLOBAL STATE
    // ══════════════════════════════════════════════════════════════════
    const catalog = { text: [], reasoning: [], image: [], video: [] };
    const state = {};   // per-suite: { selected:Set, preset:idx, prompt, judge, results:[], refImage:null }
    let activeSuite = SUITES[0].id;
    let seenModels = {};

    SUITES.forEach(s => { state[s.id] = { selected: new Set(), preset: 0, prompt: s.presets[0].prompt, judge: null, results: [], refImage: null, running: false }; });

    // ══════════════════════════════════════════════════════════════════
    // UTILITIES
    // ══════════════════════════════════════════════════════════════════
    function escHtml(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
    function shortName(id) { return String(id).split('/').pop().replace(/-\d{8}$/, ''); }
    function fmtCost(v) { if (!v || v <= 0) return '$0'; return v < 0.0001 ? '<$0.0001' : '$' + v.toFixed(4); }
    function fmtNum(n) { return (n || 0).toLocaleString(); }
    function letter(i) { return String.fromCharCode(65 + i); }
    function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2600); }
    function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('lightbox').classList.add('open'); }

    function loadSeen() { try { seenModels = JSON.parse(localStorage.getItem(SEEN_MODELS_KEY) || '{}') || {}; } catch { seenModels = {}; } }
    function isNew(m) {
      const now = Date.now(), win = NEW_WINDOW_DAYS * 864e5;
      if (m.created && (now - m.created * 1000) < win) return true;
      const seen = seenModels[m.id];
      return typeof seen === 'number' && seen > 0 && (now - seen) < win;
    }
    function modelPrice(m) {
      const p = m.model_spec?.pricing || {};
      const out = p.output?.usd, inp = p.input?.usd, per = p.usd;
      if (typeof out === 'number') return '$' + out + '/M out';
      if (typeof per === 'number') return '$' + per;
      if (typeof inp === 'number') return '$' + inp + '/M in';
      return '';
    }
    function priceOf(m) { const p = m.model_spec?.pricing || {}; return { inp: p.input?.usd || 0, out: p.output?.usd || 0, per: p.usd || 0 }; }
    function findModel(id) { return [...catalog.text, ...catalog.image, ...catalog.video].find(m => m.id === id); }

    // ══════════════════════════════════════════════════════════════════
    // CATALOG FETCH
    // ══════════════════════════════════════════════════════════════════
    async function fetchCatalog() {
      const apiKey = getApiKey();
      if (!apiKey) { document.getElementById('apiKeyBanner').style.display = 'flex'; document.getElementById('loadingOverlay').style.display = 'none'; return false; }
      const headers = { 'Authorization': 'Bearer ' + apiKey };
      const fetchType = async t => {
        try { const r = await fetch(BASE_URL + '/models?type=' + t, { headers }); if (!r.ok) return []; const d = await r.json(); return (d.data || []); }
        catch { return []; }
      };
      const [text, image, video] = await Promise.all([fetchType('text'), fetchType('image'), fetchType('video')]);
      const online = arr => arr.filter(m => m.model_spec?.offline !== true);
      catalog.text = online(text);
      catalog.image = online(image);
      catalog.video = online(video);
      catalog.reasoning = catalog.text.filter(m => {
        const c = m.model_spec?.capabilities || {}; const tr = m.model_spec?.traits || [];
        return c.supportsReasoning || tr.some(x => /reason|think/i.test(x)) || /think|reason|r1|o[0-9]|glm|qwen3|deepseek|kimi/i.test(m.id);
      });
      if (!catalog.reasoning.length) catalog.reasoning = catalog.text.slice();
      // Record newly seen (do not baseline — dashboard owns baselining; only stamp unseen)
      try {
        const raw = localStorage.getItem(SEEN_MODELS_KEY);
        if (raw !== null) {
          const now = Date.now(); let changed = false;
          [...catalog.text, ...catalog.image, ...catalog.video].forEach(m => { if (m.id && !(m.id in seenModels)) { seenModels[m.id] = now; changed = true; } });
          if (changed) localStorage.setItem(SEEN_MODELS_KEY, JSON.stringify(seenModels));
        }
      } catch {}
      return true;
    }

    function catalogFor(suite) {
      const list = catalog[suite.category] && catalog[suite.category].length ? catalog[suite.category] : catalog.text;
      // sort: new first, then reasoning/priciest (proxy for capability), else name
      return list.slice().sort((a, b) => {
        const an = isNew(a) ? 1 : 0, bn = isNew(b) ? 1 : 0;
        if (an !== bn) return bn - an;
        return String(a.id).localeCompare(String(b.id));
      });
    }

    function pickDefaults(suite) {
      const list = catalogFor(suite);
      const sel = new Set();
      list.filter(isNew).slice(0, 3).forEach(m => sel.add(m.id));           // newest few
      list.filter(m => !isNew(m)).slice(0, Math.max(1, 4 - sel.size)).forEach(m => { if (sel.size < 4) sel.add(m.id); });
      if (!sel.size && list[0]) sel.add(list[0].id);
      return sel;
    }
    function pickJudge() {
      const pref = ['glm-5', 'claude', 'gpt-5', 'gemini-3', 'qwen3', 'grok-4'];
      for (const p of pref) { const m = catalog.text.find(x => x.id.includes(p) && !/flash|mini|fast|lite/i.test(x.id)); if (m) return m.id; }
      return catalog.text[0]?.id || null;
    }
    function pickVisionJudge() {
      const vis = catalog.text.filter(m => m.model_spec?.capabilities?.supportsVision);
      const pref = ['gemini', 'gpt', 'claude', 'qwen'];
      for (const p of pref) { const m = vis.find(x => x.id.includes(p)); if (m) return m.id; }
      return vis[0]?.id || pickJudge();
    }
  </script>
  <script>
    // ══════════════════════════════════════════════════════════════════
    // UI BUILD
    // ══════════════════════════════════════════════════════════════════
    function buildSuiteBar() {
      const bar = document.getElementById('suiteBar');
      bar.innerHTML = SUITES.map(s =>
        `<button class="suite-tab${s.id === activeSuite ? ' active' : ''}" data-suite="${s.id}" onclick="switchSuite('${s.id}')">
           <span class="material-icons">${s.icon}</span>${s.name}<span class="st-dot"></span>
         </button>`).join('') +
        `<button class="suite-tab" data-suite="leaderboard" onclick="switchSuite('leaderboard')">
           <span class="material-icons">${LEADERBOARD.icon}</span>${LEADERBOARD.name}</button>`;
    }

    function switchSuite(id) {
      activeSuite = id;
      document.querySelectorAll('.suite-tab').forEach(t => t.classList.toggle('active', t.dataset.suite === id));

    function renderPicker(s) {

    function selectPreset(sid, i) {

    function syncRunCost(s) {
