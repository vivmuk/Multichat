      if (s.kind === 'video') { el.textContent = '~' + n + ' video render' + (n > 1 ? 's' : '') + ' (queue)'; return; }
      let lo = 0, hi = 0;
      state[s.id].selected.forEach(id => {
        const m = findModel(id); const p = priceOf(m || {});
        const outTok = Math.min(s.maxTokens, 4000);
        lo += (600 * p.inp + outTok * 0.4 * p.out) / 1e6;
        hi += (900 * p.inp + outTok * p.out) / 1e6;
      });
      if (s.judged) { const jm = findModel(state[s.id].judge); const jp = priceOf(jm || {}); hi += (n * 1500 * jp.inp + 1200 * jp.out) / 1e6; }
      el.textContent = lo > 0 ? '~' + fmtCost(lo) + '–' + fmtCost(hi) : 'free / trial';
    }

    function toggleDarkMode() {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('venice_theme', next);
      document.getElementById('darkModeBtn').querySelector('.material-icons').textContent = next === 'dark' ? 'light_mode' : 'dark_mode';
    }
  </script>
  <script>
    // ══════════════════════════════════════════════════════════════════
    // API CALLS
    // ══════════════════════════════════════════════════════════════════
    function stripThink(text) { return String(text).replace(/<think>[\s\S]*?<\/think>/gi, '').replace(/<\/?think>/gi, '').trim(); }
    function extractThink(text) { const m = String(text).match(/<think>([\s\S]*?)<\/think>/i); return m ? m[1].trim() : ''; }

    async function streamChat(modelId, prompt, opts, onProgress) {
      const started = Date.now();
      const body = {
        model: modelId,
        messages: [{ role: 'user', content: prompt }],
        max_tokens: opts.maxTokens || 4000,
        temperature: opts.temperature ?? 0.7,
        stream: true,
        stream_options: { include_usage: true },
        venice_parameters: { enable_web_search: 'off', disable_thinking: opts.reasoning ? false : true }
      };
      if (opts.reasoning) body.reasoning_effort = 'high';
      const resp = await fetch(BASE_URL + '/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify(body)
      });
      if (!resp.ok) { let msg = 'HTTP ' + resp.status; try { const e = await resp.json(); msg = e.error?.message || e.error || msg; } catch {} throw new Error(msg); }
      const reader = resp.body.getReader(); const dec = new TextDecoder();
      let buf = '', content = '', reasoning = '';
      let usage = { prompt_tokens: 0, completion_tokens: 0, reasoning_tokens: 0 };
      let firstTokenAt = 0;
      while (true) {
        const { done, value } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        const lines = buf.split('\n'); buf = lines.pop();
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const raw = line.slice(6); if (raw === '[DONE]') continue;
          try {
            const j = JSON.parse(raw);
            const d = j.choices?.[0]?.delta || {};
            if (d.reasoning_content) { if (!firstTokenAt) firstTokenAt = Date.now(); reasoning += d.reasoning_content; onProgress && onProgress({ content, reasoning }); }
            if (d.content) { if (!firstTokenAt) firstTokenAt = Date.now(); content += d.content; onProgress && onProgress({ content, reasoning }); }
            if (j.usage) {
              usage.prompt_tokens = j.usage.prompt_tokens || usage.prompt_tokens;
              usage.completion_tokens = j.usage.completion_tokens || usage.completion_tokens;
              usage.reasoning_tokens = j.usage.completion_tokens_details?.reasoning_tokens || usage.reasoning_tokens;
            }
          } catch {}
        }
      }
      // Fallback: reasoning embedded as <think> tags in content
      if (!reasoning) { const t = extractThink(content); if (t) { reasoning = t; content = stripThink(content); } }
      const elapsed = Date.now() - started;
      const m = findModel(modelId); const p = priceOf(m || {});
      const cost = (usage.prompt_tokens * p.inp + usage.completion_tokens * p.out) / 1e6;
      return { content: content.trim(), reasoning: reasoning.trim(), usage, elapsed, ttft: firstTokenAt ? firstTokenAt - started : 0, cost };
    }

    async function generateImage(modelId, prompt, opts) {
      const started = Date.now();
      const body = { model: modelId, prompt, width: opts.width || 1024, height: opts.height || 1024, format: 'webp', safe_mode: false };
      const resp = await fetch(BASE_URL + '/image/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify(body)
      });
      if (!resp.ok) { let msg = 'HTTP ' + resp.status; try { const e = await resp.json(); msg = e.error?.message || e.error || msg; } catch {} throw new Error(msg); }
      const data = await resp.json();
      const b64 = (data.images && data.images[0]) || (data.data && data.data[0]?.b64_json) || null;
      if (!b64) throw new Error('No image returned');
      const m = findModel(modelId); const p = priceOf(m || {});
      return { image: 'data:image/webp;base64,' + b64, elapsed: Date.now() - started, cost: p.per || p.out || 0, b64 };
    }

    async function generateVideo(modelId, prompt, opts, refB64, onLog) {
      const started = Date.now();
      const body = { model: modelId, prompt, duration: opts.duration || 5, width: opts.width || 720, height: opts.height || 1280 };
      if (refB64) body.image = refB64;
      onLog && onLog('Submitting job…');
      const resp = await fetch(BASE_URL + '/video/generate', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() }, body: JSON.stringify(body)
      });
      if (!resp.ok) { let msg = 'HTTP ' + resp.status; try { const e = await resp.json(); msg = e.error?.message || e.error || msg; } catch {} throw new Error(msg); }
      const sub = await resp.json();
      const jobId = sub.id || sub.job_id || sub.data?.id;
      if (!jobId) {
        const url = sub.url || sub.video || sub.data?.url; const b64v = sub.video_base64 || sub.b64_json;
        if (url) return { videoUrl: url, elapsed: Date.now() - started };
        if (b64v) return { videoUrl: 'data:video/mp4;base64,' + b64v, elapsed: Date.now() - started };
        throw new Error('No job id / video in response');
      }
      // poll
      for (let i = 0; i < 90; i++) {
        await new Promise(r => setTimeout(r, 4000));
        const pr = await fetch(BASE_URL + '/video/generate/' + jobId, { headers: { 'Authorization': 'Bearer ' + getApiKey() } });
        if (!pr.ok) { onLog && onLog('poll HTTP ' + pr.status + '…'); continue; }
        const ct = pr.headers.get('content-type') || '';
        if (ct.startsWith('video/')) { const blob = await pr.blob(); return { videoUrl: URL.createObjectURL(blob), elapsed: Date.now() - started }; }
        const pj = await pr.json().catch(() => ({}));
        const status = pj.status || pj.state || '';
        onLog && onLog('status: ' + (status || 'processing') + ' (' + ((Date.now() - started) / 1000 | 0) + 's)');
        if (/complete|succeed|done|finished/i.test(status) || pj.url || pj.video || pj.output) {
          const url = pj.url || pj.video || pj.output?.url || pj.data?.url; const b64v = pj.video_base64 || pj.b64_json;
          if (url) return { videoUrl: url, elapsed: Date.now() - started };
          if (b64v) return { videoUrl: 'data:video/mp4;base64,' + b64v, elapsed: Date.now() - started };
        }
        if (/fail|error/i.test(status)) throw new Error('Job failed: ' + (pj.error || status));
      }
      throw new Error('Timed out waiting for video');
    }

    // ── Judge ──────────────────────────────────────────────────────────
    async function callJudge(suite, prompt, contenders) {
      const rubric = suite.rubric;
      const rubricList = rubric.map((r, i) => `${i + 1}. ${r}`).join('\n');
      let userMsg, messages;

      if (suite.visionJudge) {
        const content = [{ type: 'text', text:
`You are a meticulous design & information-graphics judge. The following ${contenders.length} images were each generated by a different AI model from this identical brief:

"""${prompt}"""

Score EACH image (labeled A, B, C…) from 0-10 on every criterion:
${rubricList}

Pay special attention to whether printed TEXT in the image is legible, correctly spelled, and matches the brief. Return ONLY JSON.` }];
        contenders.forEach((c, i) => {
          content.push({ type: 'text', text: `--- Image ${letter(i)} ---` });
          if (c.b64) content.push({ type: 'image_url', image_url: { url: 'data:image/webp;base64,' + c.b64 } });
        });
        messages = [{ role: 'user', content }];
      } else {
        const block = contenders.map((c, i) => {
          let body = c.content || '(no response)';
          if (suite.reasoningSuite) body = (c.reasoning ? '[THINKING]\n' + c.reasoning.slice(0, 4000) + '\n\n[ANSWER]\n' : '') + body;
          return `--- Response ${letter(i)} ---\n${body.slice(0, 9000)}`;
        }).join('\n\n');
        const expected = suite.presets[state[suite.id].preset]?.expected;
        userMsg =
`You are a rigorous, impartial expert judge. ${contenders.length} AI models answered the SAME task. Score each blind — you do not know which model is which.

TASK:
"""${prompt}"""
${expected ? `\nVERIFIED REFERENCE ANSWER (ground truth for correctness scoring):\n${expected}\n` : ''}
CRITERIA (score each 0-10):
${rubricList}

${block}

Return ONLY valid JSON, no markdown fences.`;
        messages = [
          { role: 'system', content: 'You are a rigorous analytical judge. Return ONLY valid JSON.' },
          { role: 'user', content: userMsg }
        ];
      }

      const schema = `{
  "scores": [ { "label": "A", "criteria": { ${rubric.map(r => `"${r}": <0-10>`).join(', ')} }, "total": <sum>, "verdict": "one-sentence assessment" } ],
  "winner": "A",
  "summary": "2-3 sentence overall comparison naming the standout and why"
}`;
      const finalMessages = messages.slice();
      const last = finalMessages[finalMessages.length - 1];
      const appendix = `\n\nReturn EXACTLY this JSON shape (one entry per response/image, criteria keys spelled exactly as above):\n${schema}`;
      if (typeof last.content === 'string') last.content += appendix;
      else last.content.push({ type: 'text', text: appendix });

      const resp = await fetch(BASE_URL + '/chat/completions', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getApiKey() },
        body: JSON.stringify({ model: suite.judge || state[suite.id].judge, messages: finalMessages, temperature: 0.1, max_tokens: 3000 })
      });
      if (!resp.ok) throw new Error('Judge HTTP ' + resp.status);
      const data = await resp.json();
      const raw = (data.choices?.[0]?.message?.content || '').replace(/```json\s*/gi, '').replace(/```/g, '').trim();
      const match = raw.match(/\{[\s\S]*\}/); if (!match) throw new Error('Judge returned no JSON');
      let parsed; try { parsed = JSON.parse(match[0]); } catch { let f = match[0].replace(/,(\s*[}\]])/g, '$1'); const o = (f.match(/\{/g) || []).length, c = (f.match(/\}/g) || []).length; for (let i = 0; i < o - c; i++) f += '}'; parsed = JSON.parse(f); }
      return parsed;
    }
  </script>
  <script>
    // ══════════════════════════════════════════════════════════════════
    // ORCHESTRATION
    // ══════════════════════════════════════════════════════════════════
    async function runSuite(sid) {
      const suite = SUITES.find(x => x.id === sid);
      const st = state[sid];
      if (st.running) return;
      if (!getApiKey()) { toast('Set your Venice API key first'); document.getElementById('apiKeyBanner').style.display = 'flex'; return; }
      const ids = [...st.selected];
      if (ids.length < 1) { toast('Pick at least one contender'); return; }
      if (suite.kind === 'video' && !st.refImage) { toast('Upload or generate a reference image first'); return; }

      st.running = true;
      const runBtn = document.getElementById('runBtn_' + sid);
      runBtn.disabled = true; runBtn.innerHTML = '<span class="material-icons spin">refresh</span> Running…';
      const statusEl = document.getElementById('runStatus_' + sid);
      document.getElementById('verdict_' + sid).innerHTML = '';
      const prompt = (document.getElementById('prompt_' + sid).value || '').trim();

      const contenders = ids.map((id, i) => ({ id, label: letter(i), status: 'running' }));
      st.results = contenders;
      renderResults(suite, contenders);

      let doneCount = 0;
      statusEl.innerHTML = `<span class="material-icons spin" style="font-size:15px">refresh</span> Generating ${ids.length} responses…`;

      await Promise.all(contenders.map(async c => {
        try {
          if (suite.kind === 'text') {
            const r = await streamChat(c.id, prompt, { maxTokens: suite.maxTokens, temperature: suite.temperature, reasoning: !!suite.reasoningSuite },
              prog => { c.content = prog.content; c.reasoning = prog.reasoning; updateResultCard(suite, c); });
            Object.assign(c, r, { status: 'done' });
            if (suite.renderMode === 'html') c.html = extractHtml(r.content);
            if (suite.reasoningSuite) c.correct = checkCorrect(suite, c);
          } else if (suite.kind === 'image') {
            const r = await generateImage(c.id, prompt, suite.imageOpts);
            Object.assign(c, r, { status: 'done' });
          } else if (suite.kind === 'video') {
            const r = await generateVideo(c.id, prompt, suite.videoOpts, st.refImage.b64, log => { c.pollLog = (c.pollLog || '') + log + '\n'; updateResultCard(suite, c); });
            Object.assign(c, r, { status: 'done' });
          }
        } catch (e) {
          c.status = 'error'; c.error = e.message;
        }
        doneCount++;
        statusEl.innerHTML = `<span class="material-icons spin" style="font-size:15px">refresh</span> ${doneCount}/${ids.length} complete…`;
        updateResultCard(suite, c);
      }));

      // Judge
      if (suite.judged) {
        const scored = contenders.filter(c => c.status === 'done' && (c.content || c.b64));
        if (scored.length >= 1) {
          statusEl.innerHTML = `<span class="material-icons spin" style="font-size:15px">gavel</span> AI judge scoring ${scored.length}…`;
          try {
            const verdict = await callJudge(suite, prompt, scored);
            applyJudgeScores(suite, contenders, verdict);
          } catch (e) { toast('Judge failed: ' + e.message); }
        }
      }

      st.running = false;
      runBtn.disabled = false; runBtn.innerHTML = '<span class="material-icons">play_arrow</span> Run benchmark';
      statusEl.innerHTML = `<span class="material-icons" style="font-size:16px;color:var(--green)">check_circle</span> Done`;
      document.querySelector(`.suite-tab[data-suite="${sid}"]`)?.classList.add('has-results');
      renderResults(suite, contenders);
      renderVerdict(suite, contenders);
      saveHistory(suite, prompt, contenders);
      setTimeout(() => { statusEl.innerHTML = ''; }, 4000);
    }

    function extractHtml(text) {
      const m = text.match(/```html\s*([\s\S]*?)```/i) || text.match(/```\s*(<!DOCTYPE[\s\S]*?)```/i) || text.match(/(<!DOCTYPE[\s\S]*<\/html>)/i) || text.match(/(<html[\s\S]*<\/html>)/i);
      let code = m ? m[1] : text;
      if (!/<html|<!DOCTYPE|<body|<div|<section/i.test(code)) code = text; // fallback: maybe body-only
      return code.trim();
    }

    function checkCorrect(suite, c) {
      const expected = suite.presets[state[suite.id].preset]?.expected;
      if (!expected) return null;
      // heuristic: how many numeric tokens from the reference appear in the answer
      const nums = (expected.match(/\d+(?:\.\d+)?/g) || []).filter(n => n.length > 1);
      if (!nums.length) return null;
      const ans = (c.content || '').replace(/,/g, '');
      const hit = nums.filter(n => ans.includes(n)).length;
      return hit / nums.length;
    }

    function applyJudgeScores(suite, contenders, verdict) {
      const scores = verdict.scores || [];
      const maxTotal = suite.rubric.length * 10;
      contenders.forEach(c => {
        const s = scores.find(x => (x.label || '').toUpperCase() === c.label);
        if (s) {
          c.criteria = s.criteria || {};
          c.total = typeof s.total === 'number' ? s.total : Object.values(c.criteria).reduce((a, b) => a + (+b || 0), 0);
          c.totalPct = Math.round((c.total / maxTotal) * 100);
          c.jverdict = s.verdict || '';
        }
      });
      // winner = highest total
      const ranked = contenders.filter(c => typeof c.total === 'number').sort((a, b) => b.total - a.total);
      contenders.forEach(c => c.isWinner = false);
      if (ranked[0]) ranked[0].isWinner = true;
      suite._summary = verdict.summary || '';
      suite._maxTotal = maxTotal;
    }
  </script>
  <script>
    // ══════════════════════════════════════════════════════════════════
    // RESULT RENDERING
    // ══════════════════════════════════════════════════════════════════
    function renderResults(suite, contenders) {
      const host = document.getElementById('results_' + suite.id);
      host.innerHTML = contenders.map(c => resultCardHtml(suite, c)).join('');
      contenders.forEach(c => hydrateCard(suite, c));
    }

    function resultCardHtml(suite, c) {
      const sid = suite.id, cid = c.label;
      const m = findModel(c.id);
      const badge = m && isNew(m) ? '<span class="badge-new">NEW</span>' : '';
      const dot = c.status === 'done' ? 'done' : c.status === 'error' ? 'error' : 'running';
      let tabs = '', panes = '';

      if (suite.renderMode === 'html') {
        tabs = `<div class="rc-tab active" onclick="rcTab(this,'${sid}_${cid}','preview')">Live preview</div><div class="rc-tab" onclick="rcTab(this,'${sid}_${cid}','code')">Code</div>`;
        panes = `<div class="rc-pane active" id="pane_${sid}_${cid}_preview"></div><div class="rc-pane" id="pane_${sid}_${cid}_code"></div>`;
      } else if (suite.renderMode === 'reasoning') {
        tabs = `<div class="rc-tab active" onclick="rcTab(this,'${sid}_${cid}','answer')">Answer</div><div class="rc-tab" onclick="rcTab(this,'${sid}_${cid}','reasoning')">Reasoning</div>`;
        panes = `<div class="rc-pane active" id="pane_${sid}_${cid}_answer"></div><div class="rc-pane" id="pane_${sid}_${cid}_reasoning"></div>`;
      } else if (suite.renderMode === 'image' || suite.renderMode === 'video') {
        panes = `<div class="rc-pane active" id="pane_${sid}_${cid}_media"></div>`;
      } else {
        panes = `<div class="rc-pane active" id="pane_${sid}_${cid}_answer"></div>`;
      }

      return `
      <div class="result-card${c.isWinner ? ' rc-winner' : ''}" id="card_${sid}_${cid}">
        <div class="rc-head">
          <div class="rc-letter">${cid}</div>
          <div style="overflow:hidden">
            <div class="rc-name">${escHtml(shortName(c.id))} ${badge}</div>
            <div class="rc-sub">${escHtml(c.id)}</div>
          </div>
          <div class="rc-status">${c.isWinner ? '<span class="material-icons rc-trophy" title="Top score">emoji_events</span>' : ''}<span class="rc-dot ${dot}" id="dot_${sid}_${cid}"></span></div>
        </div>
        <div class="rc-metrics" id="metrics_${sid}_${cid}"></div>
        ${tabs ? `<div class="rc-tabs">${tabs}</div>` : ''}
        <div class="rc-body">${panes}</div>
        <div id="judge_${sid}_${cid}"></div>
        ${suite.kind === 'video' || !suite.judged ? starsHtml(sid, cid, c) : ''}
      </div>`;
    }

    function starsHtml(sid, cid, c) {
      const val = (c && c.stars) || 0;
      return `<div class="rc-stars"><span class="rs-label">Your rating:</span>${[1, 2, 3, 4, 5].map(n =>
        `<span class="material-icons star${n <= val ? ' on' : ''}" onclick="rateStar('${sid}','${cid}',${n})">${n <= val ? 'star' : 'star_border'}</span>`).join('')}</div>`;
    }

    function hydrateCard(suite, c) { updateResultCard(suite, c); }

    function updateResultCard(suite, c) {
      const sid = suite.id, cid = c.label;
      const dot = document.getElementById('dot_' + sid + '_' + cid);
      if (dot) dot.className = 'rc-dot ' + (c.status === 'done' ? 'done' : c.status === 'error' ? 'error' : 'running');

      const metrics = document.getElementById('metrics_' + sid + '_' + cid);
      if (metrics) {
        const parts = [];
        if (c.elapsed) parts.push(`<span>${(c.elapsed / 1000).toFixed(1)}s</span>`);
        if (c.usage?.reasoning_tokens) parts.push(`<span>reasoning <b>${fmtNum(c.usage.reasoning_tokens)}</b> tok</span>`);
        if (c.usage?.completion_tokens) parts.push(`<span>out <b>${fmtNum(c.usage.completion_tokens)}</b></span>`);
        if (c.usage?.completion_tokens && c.elapsed) parts.push(`<span><b>${(c.usage.completion_tokens / (c.elapsed / 1000)).toFixed(0)}</b> tok/s</span>`);
        if (typeof c.cost === 'number' && c.cost > 0) parts.push(`<span><b>${fmtCost(c.cost)}</b></span>`);
        if (c.correct != null) parts.push(`<span title="reference-number match">match <b>${Math.round(c.correct * 100)}%</b></span>`);
        metrics.innerHTML = parts.join('') || '<span>…</span>';
      }

      if (c.status === 'error') {
        const anyPane = document.querySelector('#card_' + sid + '_' + cid + ' .rc-pane.active');
        if (anyPane) anyPane.innerHTML = `<div class="rc-empty" style="color:var(--red)">Error: ${escHtml(c.error)}</div>`;
        return;
      }

      if (suite.renderMode === 'html') {
        const prev = document.getElementById('pane_' + sid + '_' + cid + '_preview');
        const code = document.getElementById('pane_' + sid + '_' + cid + '_code');
        if (code) code.innerHTML = c.content ? `<pre class="rc-code">${escHtml(c.html || c.content)}</pre>` : '<div class="rc-empty">…</div>';
        if (prev) {
          if (c.status === 'done' && (c.html || c.content)) {
            prev.innerHTML = `<div class="rc-iframe-wrap"><div class="rc-iframe-tools"><button class="mini-btn" onclick="openHtmlNewTab('${sid}','${cid}')"><span class="material-icons">open_in_new</span></button></div><iframe sandbox="allow-scripts" id="iframe_${sid}_${cid}"></iframe></div>`;
            const ifr = document.getElementById('iframe_' + sid + '_' + cid);
            if (ifr) ifr.srcdoc = c.html || c.content;
          } else prev.innerHTML = `<div class="rc-empty">${c.content ? 'Generating… ' + c.content.length + ' chars' : 'Waiting…'}</div>`;
        }
      } else if (suite.renderMode === 'reasoning') {
        const ans = document.getElementById('pane_' + sid + '_' + cid + '_answer');
        const rea = document.getElementById('pane_' + sid + '_' + cid + '_reasoning');
        if (ans) ans.innerHTML = c.content ? `<div class="rc-text">${escHtml(c.content)}</div>` : '<div class="rc-empty">…thinking…</div>';
        if (rea) rea.innerHTML = c.reasoning ? `<div class="rc-reasoning">${escHtml(c.reasoning)}</div>` : '<div class="rc-empty">No exposed reasoning tokens for this model.</div>';
      } else if (suite.renderMode === 'image') {
        const med = document.getElementById('pane_' + sid + '_' + cid + '_media');
        if (med) med.innerHTML = c.image ? `<img class="rc-img" src="${c.image}" onclick="openLightbox('${c.image}')" alt="generated">` : `<div class="rc-empty"><span class="material-icons spin" style="font-size:15px">refresh</span> rendering…</div>`;
      } else if (suite.renderMode === 'video') {
        const med = document.getElementById('pane_' + sid + '_' + cid + '_media');
        if (med) {
          if (c.videoUrl) med.innerHTML = `<video class="rc-video" src="${c.videoUrl}" controls loop muted playsinline></video>`;
          else med.innerHTML = `<div class="rc-empty"><span class="material-icons spin" style="font-size:15px">refresh</span> rendering…</div><div class="rc-poll-log">${escHtml(c.pollLog || '')}</div>`;
        }
      } else {
        const ans = document.getElementById('pane_' + sid + '_' + cid + '_answer');
        if (ans) ans.innerHTML = c.content ? `<div class="rc-text">${escHtml(c.content)}</div>` : '<div class="rc-empty">…</div>';
      }
    }

    function rcTab(el, key, which) {
      el.parentElement.querySelectorAll('.rc-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      document.querySelectorAll('#card_' + key + ' .rc-pane').forEach(p => p.classList.remove('active'));
      document.getElementById('pane_' + key + '_' + which)?.classList.add('active');
    }
    function openHtmlNewTab(sid, cid) {
      const c = state[sid].results.find(x => x.label === cid); if (!c) return;
      const w = window.open('', '_blank'); w.document.open(); w.document.write(c.html || c.content); w.document.close();
    }
    function rateStar(sid, cid, n) {
      const c = state[sid].results.find(x => x.label === cid); if (!c) return;
      c.stars = n;
      document.querySelectorAll('#card_' + sid + '_' + cid + ' .star').forEach((s, i) => { s.classList.toggle('on', i < n); s.textContent = i < n ? 'star' : 'star_border'; });
      saveHistory(SUITES.find(x => x.id === sid), state[sid].prompt, state[sid].results);
    }

    function renderJudgeScore(suite, c) {
      const host = document.getElementById('judge_' + suite.id + '_' + c.label);
      if (!host || typeof c.total !== 'number') return;
      const max = suite._maxTotal || suite.rubric.length * 10;
      const rows = suite.rubric.map(r => {
        const v = +(c.criteria?.[r] ?? 0);
        return `<div class="crit-row"><span class="crit-label" title="${escHtml(r)}">${escHtml(r)}</span><div class="crit-meter"><div class="crit-fill" style="width:${v * 10}%"></div></div><span class="crit-val">${v}</span></div>`;
      }).join('');
      const pct = Math.round((c.total / max) * 100);
      host.innerHTML = `<div class="rc-judge">
        <div class="rc-judge-total"><span class="jt-num">${c.total}</span><span class="jt-outof">/ ${max} · ${pct}%</span>
          <span class="jt-flag ${pct >= 60 ? 'ok' : 'bad'}">${c.isWinner ? '🏆 Top score' : pct >= 60 ? 'Solid' : 'Weak'}</span></div>
        ${rows}
        ${c.jverdict ? `<div class="rc-verdict">"${escHtml(c.jverdict)}"</div>` : ''}
      </div>`;
    }

    // ── Verdict summary + charts ────────────────────────────────────────
    function renderVerdict(suite, contenders) {
      contenders.forEach(c => renderJudgeScore(suite, c));
      const host = document.getElementById('verdict_' + suite.id);
      const done = contenders.filter(c => c.status === 'done');
      if (!done.length) { host.innerHTML = ''; return; }

      let podium = '', charts = '';
      const scored = contenders.filter(c => typeof c.total === 'number').sort((a, b) => b.total - a.total);
      if (scored.length) {
        const medals = ['🥇', '🥈', '🥉'];
        podium = `<div class="podium">${scored.slice(0, 3).map((c, i) =>
          `<div class="podium-slot${i === 0 ? ' p1' : ''}"><span class="p-medal">${medals[i]}</span><span>${escHtml(shortName(c.id))}</span><span style="color:var(--text-muted);font-family:var(--font-mono)">${c.total}/${suite._maxTotal}</span></div>`).join('')}</div>`;
        charts += hbarChart('Total score', scored.map(c => ({ label: shortName(c.id), value: c.total, max: suite._maxTotal, fmt: v => v + '/' + suite._maxTotal })), 'var(--chart-1)');
      }

      // reasoning-specific charts
      if (suite.reasoningSuite) {
        const withR = done.filter(c => c.usage?.reasoning_tokens).sort((a, b) => b.usage.reasoning_tokens - a.usage.reasoning_tokens);
        if (withR.length) charts += hbarChart('Reasoning tokens spent', withR.map(c => ({ label: shortName(c.id), value: c.usage.reasoning_tokens, max: Math.max(...withR.map(x => x.usage.reasoning_tokens)), fmt: fmtNum })), 'var(--chart-2)');
        const spd = done.filter(c => c.usage?.completion_tokens && c.elapsed).sort((a, b) => (b.usage.completion_tokens / b.elapsed) - (a.usage.completion_tokens / a.elapsed));
        if (spd.length) charts += hbarChart('Output speed (tok/s)', spd.map(c => { const v = c.usage.completion_tokens / (c.elapsed / 1000); return { label: shortName(c.id), value: v, max: Math.max(...spd.map(x => x.usage.completion_tokens / (x.elapsed / 1000))), fmt: v => v.toFixed(0) }; }), 'var(--chart-3)');
      }
      // cost chart when we have costs
      const withCost = done.filter(c => c.cost > 0).sort((a, b) => b.cost - a.cost);
      if (withCost.length > 1) charts += hbarChart('Cost per run', withCost.map(c => ({ label: shortName(c.id), value: c.cost, max: Math.max(...withCost.map(x => x.cost)), fmt: fmtCost })), 'var(--chart-3)');

      const summary = suite._summary ? `<div class="verdict-summary">${escHtml(suite._summary)}</div>` : '';
      if (!podium && !charts && !summary) { host.innerHTML = ''; return; }
      host.innerHTML = `<div class="card verdict-card">
        <div class="card-title"><span class="material-icons">workspace_premium</span>Verdict
          <span class="ct-hint"><button class="mini-btn" onclick="exportRun('${suite.id}')"><span class="material-icons">download</span> Export run</button></span></div>
        ${summary}${podium}${charts}
      </div>`;
    }

    function hbarChart(title, rows, color) {
      const body = rows.map(r => {
        const pct = r.max > 0 ? (r.value / r.max) * 100 : 0;
        return `<div class="hbar-row"><span class="hbar-label" title="${escHtml(r.label)}">${escHtml(r.label)}</span>
          <div class="hbar-track"><div class="hbar-fill" style="width:${Math.max(2, pct)}%;background:${color}"></div><span class="hbar-val">${r.fmt(r.value)}</span></div></div>`;
      }).join('');
      return `<div class="chart-block"><div class="chart-title">${escHtml(title)}</div>${body}</div>`;
    }
  </script>
  <script>
    // ══════════════════════════════════════════════════════════════════
    // REFERENCE IMAGE (video suite)
    // ══════════════════════════════════════════════════════════════════
    function onRefUpload(sid, input) {
      const f = input.files?.[0]; if (!f) return;
      const reader = new FileReader();
      reader.onload = () => {
        const dataUrl = reader.result;
        const b64 = String(dataUrl).split(',')[1];
        state[sid].refImage = { dataUrl, b64 };
        document.getElementById('refPreview_' + sid).innerHTML = `<img src="${dataUrl}" alt="ref">`;
      };
      reader.readAsDataURL(f);
    }
    async function generateRefImage(sid) {
      const imgModel = catalog.image.find(m => /flux|nano|hidream|qwen|seedream/i.test(m.id)) || catalog.image[0];
      if (!imgModel) { toast('No image model available'); return; }
      const prev = document.getElementById('refPreview_' + sid);
      prev.innerHTML = '<span class="material-icons spin">refresh</span>';
      try {
        const r = await generateImage(imgModel.id, 'A photorealistic studio portrait headshot of a friendly professional person, sharp focus, soft cinematic lighting, neutral background, looking at camera', { width: 768, height: 1024 });
        state[sid].refImage = { dataUrl: r.image, b64: r.b64 };
        prev.innerHTML = `<img src="${r.image}" alt="ref">`;
        toast('Reference face generated with ' + shortName(imgModel.id));
      } catch (e) { prev.innerHTML = '<span class="material-icons">error</span>'; toast('Failed: ' + e.message); }
    }

    // ══════════════════════════════════════════════════════════════════
    // HISTORY / LEADERBOARD
    // ══════════════════════════════════════════════════════════════════
    function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; } }
    function saveHistory(suite, prompt, contenders) {
      const hist = loadHistory();
      const entry = {
        ts: Date.now(), suite: suite.name, suiteId: suite.id, prompt: prompt.slice(0, 200),
        contenders: contenders.map(c => ({ id: c.id, total: c.total ?? null, stars: c.stars ?? null, elapsed: c.elapsed ?? null, reasoning_tokens: c.usage?.reasoning_tokens ?? null, cost: c.cost ?? null, error: c.status === 'error' })),
        winner: (contenders.find(c => c.isWinner) || {}).id || null
      };
      // replace an entry from the same run (same ts within this session) — dedupe by keeping latest for a suite in last 3s
      const filtered = hist.filter(h => !(h.suiteId === suite.id && Date.now() - h.ts < 4000));
      filtered.unshift(entry);
      localStorage.setItem(HISTORY_KEY, JSON.stringify(filtered.slice(0, 200)));
    }

    function renderLeaderboard() {
      const host = document.getElementById('leaderboardHost');
      const hist = loadHistory();
      const agg = {};
      hist.forEach(h => h.contenders.forEach(c => {
        const a = agg[c.id] = agg[c.id] || { id: c.id, runs: 0, wins: 0, totalScore: 0, scoreN: 0, stars: 0, starN: 0, reasoning: 0, reasoningN: 0 };
        a.runs++;
        if (h.winner === c.id) a.wins++;
        if (typeof c.total === 'number') { a.totalScore += c.total; a.scoreN++; }
        if (typeof c.stars === 'number' && c.stars > 0) { a.stars += c.stars; a.starN++; }
        if (typeof c.reasoning_tokens === 'number') { a.reasoning += c.reasoning_tokens; a.reasoningN++; }
      }));
      const rows = Object.values(agg).sort((a, b) => (b.wins - a.wins) || (b.scoreN ? b.totalScore / b.scoreN : 0) - (a.scoreN ? a.totalScore / a.scoreN : 0));

      const totalRuns = hist.length;
      const totalModels = rows.length;
      const topModel = rows[0] ? shortName(rows[0].id) : '—';

      const stats = `<div class="lb-stats-row">
        <div class="stat-tile"><div class="st-val">${totalRuns}</div><div class="st-lbl">BENCHMARK RUNS</div></div>
        <div class="stat-tile"><div class="st-val">${totalModels}</div><div class="st-lbl">MODELS TESTED</div></div>
        <div class="stat-tile"><div class="st-val" style="font-size:20px">${escHtml(topModel)}</div><div class="st-lbl">MOST WINS</div></div>
        <div class="stat-tile"><div class="st-val">${SUITES.length}</div><div class="st-lbl">BENCHMARK SUITES</div></div>
      </div>`;

      const table = rows.length ? `<div class="card"><div class="card-title"><span class="material-icons">military_tech</span>Model standings
        <span class="ct-hint"><button class="mini-btn" onclick="clearHistory()"><span class="material-icons">delete</span> Clear history</button></span></div>
        <div class="lb-table-wrap"><table class="lb-table">
        <thead><tr><th>#</th><th>Model</th><th>Wins</th><th>Runs</th><th>Win rate</th><th>Avg judge score</th><th>Avg stars</th><th>Avg reasoning tok</th></tr></thead>
        <tbody>${rows.map((r, i) => `<tr>
          <td class="num">${i + 1}</td>
          <td><b>${escHtml(shortName(r.id))}</b>${findModel(r.id) && isNew(findModel(r.id)) ? ' <span class="badge-new">NEW</span>' : ''}</td>
          <td class="num">${r.wins}</td>
          <td class="num">${r.runs}</td>
          <td class="num">${r.runs ? Math.round(r.wins / r.runs * 100) : 0}%</td>
          <td class="num">${r.scoreN ? (r.totalScore / r.scoreN).toFixed(1) : '—'}</td>
          <td class="num">${r.starN ? (r.stars / r.starN).toFixed(1) + '★' : '—'}</td>
          <td class="num">${r.reasoningN ? fmtNum(Math.round(r.reasoning / r.reasoningN)) : '—'}</td>
        </tr>`).join('')}</tbody></table></div></div>` : '';

      const recent = hist.slice(0, 25).map(h => {
        const d = new Date(h.ts);
        return `<div class="lb-history-item">
          <span class="hi-suite">${escHtml(h.suite)}</span>
          <span style="color:var(--text-muted);font-size:11px">${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
          <span class="hi-prompt">${escHtml(h.prompt)}</span>
          ${h.winner ? `<span class="hi-winner"><span class="material-icons" style="font-size:15px">emoji_events</span>${escHtml(shortName(h.winner))}</span>` : ''}
        </div>`;
      }).join('');

      host.innerHTML = `
        <div class="suite-hero"><div class="suite-hero-icon"><span class="material-icons">leaderboard</span></div>
          <div><h2>Leaderboard</h2><p>Aggregated across every benchmark you've run in this browser. Wins come from AI-judge totals (or your star ratings for video). Nothing leaves your device — history lives in localStorage.</p></div></div>
        ${stats}${table}
        ${recent ? `<div class="card"><div class="card-title"><span class="material-icons">history</span>Recent runs</div>${recent}</div>` : '<div class="card"><div class="rc-empty">No runs yet — go run a benchmark and results will accumulate here.</div></div>'}`;
    }
    function clearHistory() { if (confirm('Clear all local benchmark history?')) { localStorage.removeItem(HISTORY_KEY); renderLeaderboard(); toast('History cleared'); } }

    // ── Export ─────────────────────────────────────────────────────────
    function exportRun(sid) {
      const suite = SUITES.find(x => x.id === sid); const st = state[sid];
      const data = {
        exported: new Date().toISOString(), suite: suite.name, prompt: st.prompt, judge: suite.judged ? st.judge : null,
        summary: suite._summary || null,
        contenders: st.results.map(c => ({
          model: c.id, status: c.status, total: c.total ?? null, criteria: c.criteria || null, verdict: c.jverdict || null,
          stars: c.stars ?? null, elapsed_ms: c.elapsed ?? null, usage: c.usage || null, cost: c.cost ?? null,
          content: c.content || null, reasoning: c.reasoning || null
        }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'benchmark-' + sid + '-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click(); URL.revokeObjectURL(a.href); toast('Run exported as JSON');
    }

    // ══════════════════════════════════════════════════════════════════
    // BOOT
    // ══════════════════════════════════════════════════════════════════
    (async function init() {
      const theme = localStorage.getItem('venice_theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') document.getElementById('darkModeBtn').querySelector('.material-icons').textContent = 'light_mode';
      loadSeen();
      buildSuiteBar();
      const ok = await fetchCatalog();
      buildPanels();
      document.getElementById('loadingOverlay').style.display = 'none';
      if (!ok) toast('Add your Venice API key on the Chat page to run benchmarks');
    })();
  </script>
</body>
