<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Venice AI models and prices · V’s MultiGen AI Chat</title>
<meta name="description" content="Every model the Venice AI API serves, with its exact model ID to copy and its price: language, image, video, voice, music, speech-to-text, image editing, upscale, embeddings and decisions. Live, no key needed.">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="assets/icon.svg">
<link rel="icon" type="image/png" href="favicon.png">

<link rel="alternate" type="application/json" href="models.json" title="All models and prices, JSON">
<link rel="alternate" type="text/markdown" href="llms.txt" title="Index for agents">
<link rel="stylesheet" href="assets/base.css" data-inline>
<link rel="stylesheet" href="assets/app.css" data-inline>
<link rel="stylesheet" href="assets/catalog.css" data-inline>

<body>
<script src="assets/app.js" data-inline></script>

<main>
  <h1 class="vh">Venice AI models and prices</h1>
  <div class="tools">
    <div class="tools-in">
      <div class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="field" id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Search name, ID or vendor" aria-label="Search models">
        <button class="icon-btn" id="qClear" type="button" data-act="qclear" aria-label="Clear search" hidden><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="bar">
        <button class="btn" type="button" data-act="filters" aria-haspopup="dialog"><svg class="ico sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filters<span class="count" id="filterCount" hidden></span></button>
        <select class="field" id="sort" aria-label="Sort"></select>
        <button class="btn ghost" id="clearBtn" type="button" data-act="clear" hidden>Clear</button>
        <span class="count-line"><b id="count"></b><span id="fresh"></span></span>
      </div>
      <div class="types" id="types" role="tablist" aria-label="Model type"></div>
    </div>
  </div>

  <div class="list" id="list" aria-live="polite"></div>

  <noscript>
    <div class="page prose">
      <p>This catalogue needs JavaScript to filter and sort. The same data is available as plain documents:
      <a href="models.md">all models and prices as Markdown</a>, <a href="models.json">as JSON</a>, and an <a href="llms.txt">index for agents</a>.</p>
    </div>
  </noscript>
</main>

<p class="foot">Prices in US dollars, exactly as Venice reports them. Agents and scripts: <a href="llms.txt">llms.txt</a> · <a href="models.md">models.md</a> · <a href="models.json">models.json</a> · <a href="agents.html">MCP and more</a></p>

<div class="scrim" id="scrim" data-act="close"></div>

<aside class="sheet" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="sheet-head">
    <div class="sheet-title"><h2 id="dTitle"></h2><p id="dSub"></p></div>
    <button class="icon-btn sheet-close" type="button" data-act="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="dBody"></div>
</aside>

<aside class="sheet" id="filters" role="dialog" aria-modal="true" aria-labelledby="fTitle" aria-hidden="true">
  <div class="sheet-head">
    <div class="sheet-title"><h2 id="fTitle">Filters</h2><p>Each option shows how many models it leaves.</p></div>
    <button class="icon-btn sheet-close" type="button" data-act="close" aria-label="Close"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="filterBody"></div>
  <div class="sheet-foot">
    <button class="btn" type="button" data-act="clear">Clear all</button>
    <button class="btn primary block" id="filterDone" type="button" data-act="close">Show models</button>
  </div>
</aside>

<!--BOOT-->
<script src="assets/core.js" data-inline></script>
<script src="assets/catalog.js" data-inline></script>
</body>
</html>
