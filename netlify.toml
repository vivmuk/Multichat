# Netlify configuration (static fallback).
#
# The site is meant to run behind its own server (node server.js; see README),
# which puts the model list in the first response and serves the agent
# endpoints. Published as plain files it still works: the catalogue reads the
# public Venice model list from the browser instead. /llms.txt, /models.md,
# /models.json, /docs/* and /mcp exist only with the server.

[build]
  publish = "."

[[redirects]]
  from = "/fusion"
  to = "/chat.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/"
  status = 301

[[redirects]]
  from = "/chat"
  to = "/chat.html"
  status = 200

[[redirects]]
  from = "/models"
  to = "/index.html"
  status = 200
